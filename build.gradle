plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
    // Only used when launching the dedicated Litematica reference-test profile.
    maven { url = 'https://api.modrinth.com/maven' }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "civcraft_reborn" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:5.12.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.12.2"
}


// Reference-test profile: required together, but NOT packaged into CivCraft.
// Usage: gradle runClient -PschematicTest=true
if (providers.gradleProperty('schematicTest').map { it.toBoolean() }.getOrElse(false)) {
    configurations {
        schematicReferenceDownloads {
            canBeResolved = true
            canBeConsumed = false
        }
    }
    dependencies {
        modRuntimeOnly "maven.modrinth:bEpr0Arc:ZqV316KY" // Litematica 0.29.1 / MC 26.3
        modRuntimeOnly "maven.modrinth:GcWjdA9I:JX9bESec" // MaLiLib 0.30.2 / MC 26.3
        schematicReferenceDownloads "maven.modrinth:bEpr0Arc:ZqV316KY"
        schematicReferenceDownloads "maven.modrinth:GcWjdA9I:JX9bESec"
    }
    logger.lifecycle('CivCraft schematic test profile: Litematica + MaLiLib REQUIRED for runClient')
}

tasks.register('verifySchematicTestProfile') {
    group = 'verification'
    description = 'Resolve both mandatory reference mods for the schematic comparison profile'
    doLast {
        if (!providers.gradleProperty('schematicTest').map { it.toBoolean() }.getOrElse(false)) {
            throw new GradleException('Use -PschematicTest=true for the reference profile')
        }
        def dependencies = configurations.modRuntimeOnly.dependencies
        if (!dependencies.any { it.group == 'maven.modrinth' && it.name == 'bEpr0Arc' } ||
                !dependencies.any { it.group == 'maven.modrinth' && it.name == 'GcWjdA9I' }) {
            throw new GradleException('Both Litematica and MaLiLib are required for reference tests')
        }
        def downloaded = configurations.schematicReferenceDownloads.resolve()
        if (downloaded.size() < 2 ||
                !downloaded.any { it.name.toLowerCase().contains('litematica') } ||
                !downloaded.any { it.name.toLowerCase().contains('malilib') }) {
            throw new GradleException('Missing downloaded Litematica/MaLiLib 26.3 test JARs')
        }
        logger.lifecycle('Both Litematica and MaLiLib test JARs resolved: ' + downloaded.collect { it.name })
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
