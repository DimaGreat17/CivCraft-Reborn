name: P0 Fabric 26.3 compatibility

on:
  push:
    branches:
      - feat/p0-foundation-compatibility
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Install Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Static manifest validation
        run: python3 scripts/validate_p0_manifest.py
      - name: Compile mod and process resources
        run: gradle build --no-daemon --stacktrace
      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: civcraft-reborn-compatibility
          path: build/libs/*.jar
