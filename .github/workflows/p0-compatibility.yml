name: P0 Fabric 26.3 compatibility

on:
  push:
    branches:
      - feat/p0-foundation-compatibility
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Install Gradle 9.8.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"
      - name: Static manifest validation
        run: python3 scripts/validate_p0_manifest.py
      - name: Compile and unit test foundation
        run: gradle build --no-daemon --stacktrace
      - name: Smoke-test dedicated server boot and persisted settings
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          set +e
          timeout --signal=INT 110s gradle runServer --no-daemon > /tmp/civcraft-p0-server.log 2>&1
          code=$?
          set -e
          tail -n 150 /tmp/civcraft-p0-server.log
          if [[ "$code" -ne 0 && "$code" -ne 124 ]]; then
            echo "Server process failed with exit code $code"
            exit "$code"
          fi
          grep -F "CivCraft Reborn 0.1 Foundation entrypoint loaded" /tmp/civcraft-p0-server.log
          grep -F "Foundation world settings: Overworld 10000x10000 blocks" /tmp/civcraft-p0-server.log
          grep -E "Done \(" /tmp/civcraft-p0-server.log
      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: civcraft-reborn-compatibility
          path: build/libs/*.jar
